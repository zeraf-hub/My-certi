name: Get Free Cert

on:
  workflow_dispatch:

jobs:
  get-cert:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Get Cert
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          MATCH_PASSWORD: ""
        run: |
          mkdir -p cert-output
          cat > Fastfile <<'EOF'
          default_platform(:ios)
          platform :ios do
            desc "Get free cert"
            lane :get_cert do
              get_certificates(
                output_path: "cert-output",
                force: true
              )
              get_provisioning_profile(
                output_path: "cert-output",
                force: true
              )
            end
          end
          EOF
          fastlane get_cert

      - name: Upload Cert
        uses: actions/upload-artifact@v4
        with:
          name: cert-output
          path: cert-output
